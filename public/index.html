<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#170704">
  <title>메테오 포커</title>
  <link rel="icon" href="/meteor.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&display=swap">
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <canvas id="fire" class="fire" aria-hidden="true"></canvas>

  <main id="home" class="home" hidden>
    <div class="meteor">
      <img src="/meteor.png" alt="" width="148" height="148">
    </div>
    <h1>메테오 포커</h1>
    <p class="lead">가입 없이 바로 방을 만들고, 링크나 QR로 팀을 불러 함께 추정하세요.</p>
    <p id="home-error" class="error" role="alert" hidden></p>

    <div class="home-panels">
      <section class="panel" aria-labelledby="rooms-title">
        <h2 id="rooms-title">열린 방</h2>
        <ul id="room-list" class="room-list"></ul>
        <p id="room-empty" class="hint" hidden>열린 방이 없습니다. 새 방을 만들어 팀원을 초대하세요.</p>
      </section>

      <form id="create-form" class="panel" aria-labelledby="create-title">
        <h2 id="create-title">새 방 만들기</h2>
        <label for="room-name">방 이름</label>
        <input id="room-name" maxlength="30" placeholder="예: 결제팀 스프린트 12" autocomplete="off">
        <label for="room-password">비밀번호 (선택)</label>
        <input id="room-password" type="password" maxlength="64" autocomplete="new-password">
        <p class="hint">비워두면 누구나 들어올 수 있습니다.</p>
        <button id="create-room" class="primary" type="submit">방 만들기</button>
      </form>
    </div>
  </main>

  <main id="name-view" class="home entry" hidden>
    <h1 id="name-title"></h1>
    <form id="name-form" class="enter">
      <label for="name-input">팀원들에게 보일 이름</label>
      <input id="name-input" maxlength="20" autocomplete="nickname" required>
      <div id="password-field" hidden>
        <label for="password-input">비밀번호</label>
        <input id="password-input" type="password" maxlength="64" autocomplete="current-password">
      </div>
      <p id="entry-error" class="error" role="alert" hidden></p>
      <button class="primary" type="submit">입장</button>
      <a class="back" href="/">방 목록으로</a>
    </form>
  </main>

  <div id="room-view" class="room" hidden>
    <header class="bar">
      <a class="brand" href="/">메테오 포커</a>
      <span id="room-label" class="room-label"></span>
      <button id="rename" class="link" type="button"></button>
      <button id="invite-toggle" class="invite-toggle" type="button">팀원 초대</button>
      <button id="leave" class="leave" type="button">나가기</button>
    </header>
    <p id="banner" class="banner" role="status" hidden></p>

    <div class="layout">
      <main class="table-wrap">
        <section class="table" aria-label="테이블">
          <div id="seats" class="seats"></div>
          <div id="result" class="result" hidden>
            <p id="consensus" class="consensus" hidden>모두 같은 카드를 골랐습니다.</p>
            <dl id="numbers" class="numbers">
              <div><dt>평균</dt><dd id="average"></dd></div>
              <div><dt>중앙값</dt><dd id="median"></dd></div>
            </dl>
            <ul id="counts" class="counts"></ul>
          </div>
          <div class="actions">
            <button id="reveal" class="reveal" type="button">카드 공개</button>
            <button id="clear" class="reveal" type="button" hidden>다음 라운드</button>
            <p id="status" class="status"></p>
          </div>
        </section>
      </main>

      <aside id="side" class="side">
        <button id="side-close" class="link side-close" type="button">닫기</button>
        <section class="invite">
          <h2>팀원 초대</h2>
          <img id="qr" class="qr" alt="방 입장 QR 코드" width="200" height="200">
          <p class="room-number">방 번호 <strong id="room-number"></strong></p>
          <a id="join-url" class="join-url" target="_blank" rel="noopener"></a>
          <button id="copy" type="button">링크 복사</button>
        </section>
        <section id="settings" class="settings" hidden>
          <h2>방 설정</h2>
          <label for="deck-select">카드 덱</label>
          <select id="deck-select">
            <option value="standard">기본 (0, 0.5, 1, 2, 3, 5, 8…)</option>
            <option value="fibonacci">피보나치 (1, 2, 3, 5, 8…)</option>
            <option value="tshirt">티셔츠 (XS ~ XXL)</option>
            <option value="powers">2의 거듭제곱 (1, 2, 4, 8…)</option>
            <option value="custom">직접 입력</option>
          </select>
          <form id="custom-deck" hidden>
            <label for="custom-input">쉼표로 구분, 카드당 3자 이내</label>
            <input id="custom-input" placeholder="1, 2, 3, ?" autocomplete="off">
            <button type="submit">덱 적용</button>
            <p id="custom-error" class="error" role="alert" hidden></p>
          </form>
          <p class="hint">덱을 바꾸면 이번 라운드 투표가 지워집니다.</p>
          <label class="check"><input id="host-only" type="checkbox"> 방장만 공개와 다음 라운드 진행</label>
        </section>
      </aside>
    </div>

    <nav id="hand" class="hand" aria-label="내 카드"></nav>
  </div>

  <script src="/app.js" type="module"></script>
</body>
</html>
